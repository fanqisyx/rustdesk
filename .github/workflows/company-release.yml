name: Company prerelease

on:
  push:
    branches:
      - 'release/company-*'
    tags:
      - 'v*-company.*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify company release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = pathlib.Path('COMPANY_RELEASE').read_text().strip()
          assert re.fullmatch(r'v\d+\.\d+\.\d+-company\.\d+', tag)
          ref = os.environ['RELEASE_REF']
          assert ref in (f'refs/tags/{tag}', f'refs/heads/release/company-{tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - run: pip install -r management/requirements-dev.txt
      - run: python -m unittest discover -s management -p 'test_*.py' -v
      - name: Build management container
        run: docker build --tag rustdesk-management:company management
      - name: Package committed source and management service
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python tools/package_company_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: company-release-bundles
          path: dist/company-release/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: company-release-bundles
          path: release
      - name: Publish company prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "RustDesk company management $RELEASE_TAG" --notes-file "release/release-notes-$RELEASE_TAG.md" --prerelease
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "RustDesk company management $RELEASE_TAG" --notes-file "release/release-notes-$RELEASE_TAG.md" --prerelease
          fi

  native-clients:
    needs: [package, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ needs.package.outputs.tag }}
      publish-update-metadata: false
      enterprise-required: true
